</head><body><div id="bg"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const W=1000,H=1250;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(W,H); renderer.setPixelRatio(2);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=0.3; renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32, W/H, .01, 100);
const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;
scene.add(new THREE.HemisphereLight(0xeaf0f7,0x0b1220,.7));
const key=new THREE.DirectionalLight(0xfff1dd,2.3); key.position.set(2.5,4,3); scene.add(key);
const fill=new THREE.DirectionalLight(0x9fb6d6,.5); fill.position.set(-3,1.2,-2.5); scene.add(fill);
const loader=new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder); let current=null;
function loop(){ renderer.render(scene,camera); requestAnimationFrame(loop); } loop();
window.loadModel=(url)=>new Promise((res,rej)=>{
  if(current){ scene.remove(current); current=null; }
  loader.load(url,(g)=>{
    const m=g.scene;
    let box=new THREE.Box3().setFromObject(m); let size=box.getSize(new THREE.Vector3());
    const maxDim=Math.max(size.x,size.y,size.z)||1; m.scale.setScalar(1/maxDim);
    box=new THREE.Box3().setFromObject(m); size=box.getSize(new THREE.Vector3());
    const c=box.getCenter(new THREE.Vector3()); m.position.sub(c);
    scene.add(m); current=m;
    const dist=(1/(2*Math.tan((camera.fov*Math.PI)/360)))*1.3;
    camera.position.set(dist*0.42, dist*0.26, dist*0.95); camera.lookAt(0,0,0);
    setTimeout(()=>res(true),250);
  }, undefined, (e)=>rej(String(e)));
});
window.__ready=true;
</script></body></html>
