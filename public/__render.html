 html,body{margin:0;height:100%;overflow:hidden}

   radial-gradient(58% 44% at 50% 16%, rgba(224,169,91,.18), transparent 70%),
   radial-gradient(125% 95% at 50% -2%, #1d2b46, #0c1424 72%);}
 canvas{position:fixed;inset:0}

</head><body><div id="bg"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const W=1000,H=1250;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(W,H); renderer.setPixelRatio(2);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=0.2; renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32, W/H, .01, 100);
const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;
scene.add(new THREE.HemisphereLight(0xeaf0f7,0x0b1220,.7));
const key=new THREE.DirectionalLight(0xfff1dd,2.3); key.position.set(2.5,4,3); scene.add(key);
const fill=new THREE.DirectionalLight(0x9fb6d6,.5); fill.position.set(-3,1.2,-2.5); scene.add(fill);
const loader=new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder); let current=null;
function loop(){ renderer.render(scene,camera); requestAnimationFrame(loop); } loop();
function orientModel(model, upAxis='auto') {
  const [axis, , yawValue]=String(upAxis || 'auto').toLowerCase().split(':');
  let box=new THREE.Box3().setFromObject(model);
  let size=box.getSize(new THREE.Vector3());
  const isLikelyZUp = size.z > size.y * 1.15 && size.z > Math.min(size.x, size.y) * 1.15;
  if (axis === 'z' || (axis === 'auto' && isLikelyZUp)) model.rotation.x -= Math.PI / 2;
  const yaw=Number(yawValue)||0;
  if (yaw) model.rotation.y += (yaw*Math.PI)/180;
}
function removeScanHelpers(model) {
  const helpers=[];
  model.traverse((obj)=>{
    if (/^(?:cubo|disco)(?:_|\.|$)/i.test(obj.name || '') || /^(?:cubo|disco)(?:_|\.|$)/i.test(obj.material?.name || '')) helpers.push(obj);
  });
  for (const helper of helpers) helper.parent?.remove(helper);
}
window.loadModel=(url, upAxis='auto')=>new Promise((res,rej)=>{
  if(current){ scene.remove(current); current=null; }
  loader.load(url,(g)=>{
    const m=g.scene;
    removeScanHelpers(m);
    orientModel(m, upAxis);
    let box=new THREE.Box3().setFromObject(m); let size=box.getSize(new THREE.Vector3());
    const maxDim=Math.max(size.x,size.y,size.z)||1; m.scale.setScalar(1/maxDim);
    box=new THREE.Box3().setFromObject(m); size=box.getSize(new THREE.Vector3());
    const c=box.getCenter(new THREE.Vector3()); m.position.sub(c);
    scene.add(m); current=m;
    const isWideLow=Math.max(size.x,size.z)>Math.max(size.y*1.8,0.65);
    const fitOverride=Number(String(upAxis || '').split(':')[1])||0;
    const fit=fitOverride || (isWideLow?1.9:1.3);
    const dist=(1/(2*Math.tan((camera.fov*Math.PI)/360)))*fit;
    camera.position.set(dist*0.42, dist*0.26, dist*0.95); camera.lookAt(0,0,0);
    setTimeout(()=>res(true),350);
  }, undefined, (e)=>rej(String(e)));
});
window.__ready=true;
const params=new URLSearchParams(window.location.search);
const model=params.get('model');
if (model) {
  window.__ready=false;
  window.loadModel(model, params.get('up') || 'auto')
    .then(() => { window.__ready=true; document.body.dataset.renderReady='true'; })
    .catch((err) => { window.__ready=true; document.body.dataset.renderError=String(err); });
}
</script></body></html>
